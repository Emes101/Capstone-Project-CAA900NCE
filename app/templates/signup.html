{% extends "base.html" %}
{% block title %}Create an account{% endblock %}
{% block content %}
<section class="login">
  <h1>Create an account</h1>
  <p>Sign up to reserve items for pickup (coming soon). You can check stock without an account.</p>
  <form method="post" action="{{ url_for('signup') }}" class="login-form">
    <label for="name">Name</label>
    <input id="name" name="name" type="text" value="{{ name }}" maxlength="80" autocomplete="name" required autofocus>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required>
    <label for="password">Password (at least 8 characters)</label>
    <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
    <button type="submit">Create account</button>
  </form>
  <p class="login-note">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
</section>
{% endblock %}
