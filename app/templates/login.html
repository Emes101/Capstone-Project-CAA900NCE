{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<section class="login">
  <h1>Sign in</h1>
  <p>Customers and the store owner sign in here.</p>
  <form method="post" action="{{ url_for('login') }}" class="login-form">
    <input type="hidden" name="next" value="{{ next_page }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
  </form>
  <p class="login-note">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
</section>
{% endblock %}
