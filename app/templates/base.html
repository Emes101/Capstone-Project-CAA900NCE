<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}StockWise{% endblock %} · StockWise Solutions</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="{{ url_for('customer') }}">StockWise <span>Solutions</span></a>
      <nav>
        <a href="{{ url_for('customer') }}" class="{{ 'active' if request.endpoint == 'customer' }}">Shop availability</a>
        <a href="{{ url_for('owner') }}" class="{{ 'active' if request.endpoint == 'owner' }}">Owner dashboard</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="flash flash-{{ category }}" role="status">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer class="wrap footer">
    CAA900 capstone · StockWise Solutions · Sample data only
  </footer>
</body>
</html>
